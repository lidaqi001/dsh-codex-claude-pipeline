name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static smoke tests (no dependencies)
        run: node --test test/*.test.mjs
      - name: Packed file list
        run: npm pack --dry-run
